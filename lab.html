<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#241713" />
    <meta
      name="description"
      content="A stone seen from above. Dust wells up; shape it with your fingers."
    />
    <title>Dust Offering — Stone study</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/src/assets/fonts/FringeV2.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
  </head>
  <body>
    <main class="app lab">
      <header>
        <h1>Dust Offering</h1>
        <button id="sound" aria-pressed="false">Sound off</button>
      </header>
      <nav class="modes" aria-label="Stone study">
        <button data-goal="level" aria-pressed="false">Level</button>
        <button data-goal="clear" aria-pressed="false">Clear</button>
        <button data-goal="gather" aria-pressed="true">Piles</button>
        <button data-goal="paths" aria-pressed="false">Paths</button>
      </nav>
      <div class="hud">
        <span id="fit">Fit 0%</span
        ><meter
          id="progress"
          min="0"
          max="1"
          value="0"
          aria-label="Arrangement fit"
        ></meter
        ><span id="material">Dust surfacing</span>
      </div>
      <p id="instruction" class="goal-instruction"></p>
      <div class="stage">
        <canvas
          id="field"
          tabindex="0"
          aria-label="Stone viewed from above. Dust wells up in different places and rests without gravity. Push it with one or more fingers. Dust outside the triangle can be swept back onto it."
        ></canvas>
      </div>
      <div class="tools" aria-label="Stone controls">
        <button id="pause">Pause wells</button
        ><button id="guide" aria-pressed="true">Guide on</button>
        <button id="restart">Restart</button
        ><button id="next">New stone</button>
      </div>
      <p id="accessible-state" class="sr-only" aria-live="off"></p>
    </main>
    <script type="module" src="/src/lab/main.js"></script>
  </body>
</html>
