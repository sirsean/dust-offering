name: Remove branch preview

on: delete

permissions:
  contents: read

concurrency:
  group: dust-offering-Check and deploy-refs/heads/${{ github.event.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.repository == 'sirsean/dust-offering' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check cleanup credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Preview cleanup skipped: configure the CLOUDFLARE_API_TOKEN Actions secret, or remove the preview with npm run deploy:branch:delete.'
            echo 'Automatic cleanup is waiting for the `CLOUDFLARE_API_TOKEN` repository secret. Remove any manually deployed preview with `npm run deploy:branch:delete -- branch-name`.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Delete the branch Worker and its custom domain
        if: steps.cloudflare.outputs.configured == 'true'
        run: node scripts/deploy.js --delete-branch "$DELETED_BRANCH"
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
