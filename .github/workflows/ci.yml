name: Check and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dust-offering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy production
        if: github.repository == 'sirsean/dust-offering' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/deploy.js --production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy branch preview
        if: github.repository == 'sirsean/dust-offering' && github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: node scripts/deploy.js --branch "$DEPLOY_BRANCH"
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
