name: Check and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dust-offering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install browser for gameplay checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
      - name: Check deployment credentials
        id: cloudflare
        if: github.repository == 'sirsean/dust-offering' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloudflare deployment skipped: configure the CLOUDFLARE_API_TOKEN Actions secret to enable automatic deployments.'
            echo 'Code and browser checks passed. Automatic deployment is deferred; manual Wrangler deployment is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy production
        if: steps.cloudflare.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        run: node scripts/deploy.js --production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy branch preview
        if: steps.cloudflare.outputs.configured == 'true' && github.ref != 'refs/heads/main'
        run: node scripts/deploy.js --branch "$DEPLOY_BRANCH"
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
