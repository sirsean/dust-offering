<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#241713" />
    <meta
      name="description"
      content="On every world with air to breathe, wind blows the sand. In the void, who will push the sand?"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dust Offering" />
    <meta
      property="og:description"
      content="On every world with air to breathe, wind blows the sand. In the void, who will push the sand?"
    />
    <meta
      property="og:image"
      content="https://dust-offering.sirsean.me/share.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Dust Offering pyramid, outlined in amber against dark umber."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Dust Offering</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/src/assets/fonts/FringeV2.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
  </head>
  <body>
    <main class="app piles">
      <header>
        <h1>Dust Offering</h1>
        <button id="sound" aria-pressed="false">Sound off</button>
      </header>
      <div class="hud">
        <p id="offering"></p>
        <p>Sweep dust into each ring.</p>
        <p id="status" role="status"></p>
      </div>
      <div class="stage">
        <canvas
          id="field"
          tabindex="-1"
          aria-label="Brush to uncover the stone. Dust reveals it where it rests or passes. Share dust across the marked rings. A ring brightens as it fills. Rust-colored ticks mark a ring with too much dust. Spilled dust can be swept back onto the stone."
          aria-describedby="piles-progress"
        ></canvas>
        <p id="piles-progress" class="sr-only"></p>
      </div>
      <div class="tools" aria-label="Offering controls">
        <button id="pause">Pause wells</button>
        <button id="restart">Restart</button>
        <button id="next" disabled>Next</button>
      </div>
    </main>
    <dialog
      class="piles-record"
      aria-labelledby="record-title"
      aria-describedby="record-body"
    >
      <p id="record-number"></p>
      <h2 id="record-title" tabindex="-1" autofocus></h2>
      <div id="record-body"></div>
      <button id="continue">Continue</button>
    </dialog>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
